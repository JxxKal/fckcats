services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-fckcats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - siehe .env.example}
      POSTGRES_DB:       ${POSTGRES_DB:-fckcats}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fckcats} -d ${POSTGRES_DB:-fckcats}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fckcats-net]

  api:
    build:
      context: ./api
      # Proxy nur fuer den Bau. Docker behandelt diese Namen als vordefinierte
      # Build-Argumente: sie landen in der Umgebung jedes RUN-Schritts, also
      # auch bei apt und pip, und werden nicht in die Image-Historie
      # geschrieben.
      args:
        HTTP_PROXY:  ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY:    ${NO_PROXY:-localhost,127.0.0.1}
        http_proxy:  ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy:    ${NO_PROXY:-localhost,127.0.0.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-fckcats}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fckcats}
      SECRET_KEY:   ${SECRET_KEY:?SECRET_KEY fehlt - siehe .env.example}
      DATA_MASTER_KEY: ${DATA_MASTER_KEY:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD fehlt - siehe .env.example}
      CERT_DIR:  /certs
      DATA_DIR:  /data
      TYPICAL_WEEK_HOURS: ${TYPICAL_WEEK_HOURS:-38}
      # Proxy zur Laufzeit, etwa fuer den Bezug von ACME-Zertifikaten.
      # postgres muss ausgenommen sein, sonst laeuft der Datenbankverkehr
      # ueber den Proxy und scheitert.
      HTTP_PROXY:  ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY:    ${NO_PROXY:-localhost,127.0.0.1,postgres,api,nginx}
      http_proxy:  ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy:    ${NO_PROXY:-localhost,127.0.0.1,postgres,api,nginx}
    volumes:
      # API schreibt Zertifikate und Hostname, nginx liest sie beim Start.
      - certs:/certs
      # Hochgeladene PDFs und erzeugte XLSX je Workspace.
      - data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [fckcats-net]

  nginx:
    build:
      context: ./frontend
      # Wird fuer npm install beim Bau des Frontends gebraucht.
      args:
        HTTP_PROXY:  ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY:    ${NO_PROXY:-localhost,127.0.0.1}
        http_proxy:  ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy:    ${NO_PROXY:-localhost,127.0.0.1}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # nginx lauscht im Container auf 443; der nach aussen sichtbare Port muss
      # bekannt sein, damit die Weiterleitung von 80 nicht ins Leere zeigt.
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Nur lesend: das Zertifikat wird ausschliesslich ueber die API verwaltet.
      - certs:/certs:ro
    networks: [fckcats-net]

volumes:
  postgres-data:
  certs:
  data:

networks:
  fckcats-net:
    driver: bridge
